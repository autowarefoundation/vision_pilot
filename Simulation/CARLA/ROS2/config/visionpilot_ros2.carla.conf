# VisionPilot ROS2 topics - CARLA closed-loop drive.
#
# Camera in : CARLA-native sensor.camera.rgb, published by the server as
#             /carla/hero/<sensor ros_name>/image (bgra8).
# Actuation : VisionPilot publishes Float64 /vehicle/{steering,throttle}_cmd;
#             carla_control_publisher turns the pair into one
#             ackermann_msgs/AckermannDriveStamped on
#             /carla/hero/ackermann_control_cmd.
# Ego speed : Float64 /vehicle/speed from carla_vehicle_speed_publisher
#             (CARLA emits no ROS odometry for the ego).

source.input_camera_topic   = /carla/hero/main_cam/image

vehicle_speed_topic         = /vehicle/speed
vehicle_steering_topic      = /vehicle/steering_cmd
vehicle_acceleration_topic  = /vehicle/throttle_cmd
