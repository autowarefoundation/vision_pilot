# == Vision Pilot documentation site ============================================
# Served by GitHub Pages from the `github-io/` folder of autowarefoundation/vision_pilot
# Live at: https://autowarefoundation.github.io/vision_pilot/

title: Vision Pilot
tagline: Open Source L2 ADAS
description: >-
  Vision Pilot is a free, fully open-source, productionizable and safety
  certifiable L2 ADAS stack from the Autoware Foundation. Camera-only, mapless,
  Apache 2.0 - including AI model weights.

url: "https://autowarefoundation.github.io"
baseurl: "/vision_pilot"

# == Project-wide links, referenced from templates as {{ site.links.x }} ========
