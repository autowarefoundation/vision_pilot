# == Left-hand navigation for every /docs page =================================
docs_nav:
  - group: Start here
    items:
      - { title: Overview, url: /github-io/ }
      - { title: Getting started, url: /github-io/getting-started/ }
      - { title: Configuration, url: /github-io/configuration/ }
  - group: Understand
    items:
      - { title: Architecture, url: /github-io/architecture/ }
      - { title: Modules, url: /github-io/modules/ }
  - group: Run it
    items:
      - { title: Simulation, url: /github-io/simulation/ }
      - { title: Hardware and calibration, url: /github-io/hardware/ }
  - group: Project
    items:
      - { title: Releases, url: /github-io/releases/ }
      - { title: Functional safety, url: /github-io/functional-safety/ }
      - { title: Contributing, url: /github-io/contributing/ }

# == Build =====================================================================
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  toc_levels: 2..3

plugins:
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
