[build-system]
# Ipopt (casadi) and CppAD (cmeel-cppad) come as prebuilt wheels: the extension
# compiles against them and loads their libraries at run time, so the pins
# below must match the runtime dependencies. See cmake/PythonDeps.cmake.
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.8",
    "casadi==3.8.1",
    "cmeel-cppad==20250000.2",
]
build-backend = "scikit_build_core.build"

[project]
name = "vision-pilot"
version = "1.0.0"
description = "Python bindings for the VisionPilot perception -> planning loop, for closed-loop simulation"
readme = "python/README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "casadi==3.8.1",           # Ipopt for the lateral MPC
    "cmeel-cppad==20250000.2", # libcppad_lib
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# Closed-loop testing: VisionPilot as an alpasim EgodriverService policy
# (vision_pilot.driver, `vision-pilot-driver`) and carla-driver-interface's
# runtime to drive it (CarlaRuntime, FakeWorld, `carla-driver-interface run /
# demo`, the `--rig` that registers VisionPilot's vehicle and camera).
# alpasim's protos limit it to CPython 3.11 / 3.12. The CARLA client itself is
# left out: it has to match the server (0.9.x is `carla` on PyPI, 0.10.x ships
# its own PythonAPI, see `--carla-python-path`).
closed-loop-test = [
    "carla-driver-interface>=0.1; python_version >= '3.11' and python_version < '3.13'",
]

[project.scripts]
vision-pilot-driver = "vision_pilot.driver:main"

# `carla-driver-interface run --rig vision_pilot`: the vehicle and camera
# VisionPilot is tuned for (python/src/vision_pilot/carla_rig.toml).
[project.entry-points."carla_driver_interface.rigs"]
vision_pilot = "vision_pilot.driver:carla_rig"

[project.urls]
Repository = "https://github.com/autowarefoundation/vision_pilot"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "opencv-python-headless>=5.0.0.93",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# Fetched from PyPI when the system has none (or an older one).
cmake.version = ">=3.22.1"
ninja.version = ">=1.10"
cmake.build-type = "Release"
cmake.define = { BUILD_PYTHON_BINDINGS = "ON", BUILD_APP = "OFF" }
wheel.packages = ["python/src/vision_pilot"]
# Only the extension, its ONNX Runtime and stubs: not what dependencies install.
install.components = ["python"]
# abi3 wheels on CPython >= 3.12 (nanobind's STABLE_ABI); a per-version wheel below that.
wheel.py-api = "cp312"
# The weights are large and sit in the source tree; Pilot takes model_dir instead.
sdist.exclude = ["modules/models/weights", "docker", "build"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.uv]
# Rebuild the extension whenever a C++ source or build file changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "modules/**/CMakeLists.txt" },
    { file = "python/CMakeLists.txt" },
    { file = "cmake/*.cmake" },
    { file = "modules/**/*.cpp" },
    { file = "modules/**/*.hpp" },
    { file = "python/bindings.cpp" },
]

[tool.uv.sources]
carla-driver-interface = { git = "https://github.com/hakuturu583/carla_driver_interface", rev = "5521c013125813439e5c74ebb8c79095750b1cdd" }
