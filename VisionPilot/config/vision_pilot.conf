# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ─── Merged single-session inference ─────────────────────────────────────────
# Run all three networks in one session over a merged graph. Required when
# engine.provider = renesas, which permits one NPU session per process.
# Default false: three separate sessions, unchanged behaviour.
model.merged      = false
model.merged_path =
# auto | none | <path to contract.json>
# "auto" looks for <merged_path>.contract.json, then contract.json inside
# engine.artifacts_dir, then a single *.contract.json there -- the name a
# contract is distributed under, and the only form the renesas provider can
# use, since it has no model path to key a sidecar on. Two *.contract.json
# files in one artifacts directory are refused as ambiguous. A rewritten
# (v6/v7) model without its contract is refused rather than misread.
# "none" forces plain-merged mode: the model's raw prefixed outputs
# (steer_lane_value, steer_height, drive_distance, drive_curvature,
# drive_flag_logit, speed_output), no contract read.
model.contract    = auto

# ─── Renesas R-Car X5H NPU ───────────────────────────────────────────────────
# Compiled artifact set: must contain nnx/, fused_subgraphs/, legalized_*.onnx.
# Ship candidate: .../merged/v7_frozen_s3cal_artifacts
#
# NOT RELOCATABLE: nnx/manifest.json records the absolute path the set was
# compiled at, and the execution provider loads from that recorded path rather
# than from the base_path the engine passes it. Mounting the set anywhere else
# fails with "fopen: No such file or directory". Bind-mount it at the path
# manifest.json names, or recompile.
engine.artifacts_dir     =
# Directory holding the vendor runtime's arc_prog binaries. This is the vendor
# wheel's onnxruntime/nnac_portable_env/binary directory itself, not one of the
# arc_prog_npus / arc_prog_npun subdirectories inside it.
engine.arc_prog_path     =
# Minimum number of nodes that must be on the NPU at startup, counted from the
# per-execution-provider histogram in the profile JSON. 0 means "at least one".
#
# Only 0 and 1 are meaningful for a merged graph: the execution provider
# absorbs the whole thing into ONE fused subgraph node, so the gate reports
# "1 nodes on the NPU" however many operators the graph has. Any value >= 2
# therefore fails unconditionally. Pin it to 1 to catch a recompile that sheds
# the subgraph to the CPU; leave it at 0 for the same check without the
# hard-coded count.
engine.require_npu_nodes = 0

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
L                = 2.860   # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080

# ─── Rerun logging ───────────────────────────────────────────────────────────
# Stream per-frame data directly to an .rrd recording (open with: rerun <file>).
rrd_on  = false
rrd_log = visionpilot.rrd