name: build-vision-pilot

# The standalone-build job builds VisionPilot (CPU variant) and the test
# executables with plain CMake, without ROS 2, to catch build breakages before
# merging. The autoware-index job builds, tests and runs clang-tidy on the
# package with rosdep and colcon in the Autoware Core image, the same way the
# Autoware Index sweep builds it. A colcon build turns on the ROS 2 interface,
# so the autoware-index job covers the ROS 2 build.
#
# The workflow runs on every pull request. The changes job skips the build
# jobs when no build file changed. The ci-result job always reports, so it
# can be a required check.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ONNXRUNTIME_ROOT: /opt/onnxruntime

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.filter.outputs.build == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find changed build files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - VisionPilot/**
              - .github/actions/setup-vision-pilot-deps/**
              - .github/workflows/build-vision-pilot.yaml

  standalone-build:
    name: standalone-build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup-vision-pilot-deps
        with:
          onnxruntime-root: ${{ env.ONNXRUNTIME_ROOT }}

      - name: Configure
        run: |
          cmake -S VisionPilot -B VisionPilot/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNXRUNTIME_ROOT="${ONNXRUNTIME_ROOT}" \
            -DGPU=OFF \
            -DENABLE_ROS2_INTERFACE=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-lcppad_lib"
        shell: bash

      - name: Build
        run: cmake --build VisionPilot/build -j "$(nproc)"
        shell: bash

  autoware-index:
    name: autoware-index
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: autowarefoundation/autoware-index-github-actions/.github/workflows/validate-package.yaml@main
    with:
      ros_distro: jazzy
      package_name: vision_pilot
      pull-ccache: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      push-ccache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      cache-key-element: build

  ci-result:
    name: ci-result
    if: always()
    needs:
      - changes
      - standalone-build
      - autoware-index
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
