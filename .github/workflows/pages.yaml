---
name: deploy-github-io-site

# Builds the Jekyll site in github-io/ and publishes it to GitHub Pages.
#
# One-time repository setup: Settings => Pages => Build and deployment =>
# Source: "GitHub Actions".
#
# Live at https://autowarefoundation.github.io/vision_pilot/

on:
  push:
    branches: [main]
    paths:
      - github-io/**
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: github-io

      - uses: actions/configure-pages@v5

      - name: Build site
        working-directory: github-io
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
