name: vision-pilot-python

on:
  pull_request:
    paths:
      - VisionPilot/**
      - .github/workflows/vision-pilot-python.yaml
  push:
    branches:
      - main
    paths:
      - VisionPilot/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: VisionPilot
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No apt step: the native dependencies come from uv (cmake/PythonDeps.cmake).
      - name: Build and install
        # closed-loop-test resolves to nothing on 3.10 (alpasim's protos need 3.11+);
        # its tests skip there.
        run: uv sync --locked --extra closed-loop-test --python ${{ matrix.python-version }}

      - name: Type-check against the generated stubs
        run: uv run mypy python/src/vision_pilot python/tests --ignore-missing-imports

      - name: Test
        run: uv run pytest -v
