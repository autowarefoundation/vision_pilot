name: vision-pilot-python

on:
  pull_request:
    paths:
      - VisionPilot/**
      - .github/workflows/vision-pilot-python.yaml
  push:
    branches:
      - main
    paths:
      - VisionPilot/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: VisionPilot
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libopencv-dev coinor-libipopt-dev libcppad-dev liblapack-dev libblas-dev
          sudo ln -sf "$(dirname "$(find /usr/include -name IpIpoptApplication.hpp | head -1)")" /usr/include/coin-or

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Type-check against the generated stubs
        run: uv run mypy python/src/vision_pilot python/tests --ignore-missing-imports

      - name: Test
        run: uv run pytest -v
